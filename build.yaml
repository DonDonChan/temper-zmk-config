# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Nice!Nano v2
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset_nice_nano_v2

  - board: nice_nano_v2
    shield: temper_left
    artifact-name: temper_left_nice_nano_v2

  - board: nice_nano_v2
    shield: temper_right
    artifact-name: temper_right_nice_nano_v2

  # BMP Boost
  - board: bmp_boost
    shield: settings_reset
    artifact-name: settings_reset_bmp_boost

  - board: bmp_boost
    shield: temper_left
    artifact-name: temper_left_bmp_boost

  - board: bmp_boost
    shield: temper_right
    artifact-name: temper_right_bmp_boost
